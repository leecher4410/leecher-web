<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DISCOGRAPHY | Leecher</title>
  <link rel="icon" href="images/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #080808;
      --card-bg: rgba(18, 18, 18, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-border-hover: rgba(255, 255, 255, 0.25);
      --text-main: #f0f0f0;
      --text-muted: #888888;
      --accent-color: #e53935;
      --font-heading: 'Syne', sans-serif;
      --font-body: 'Inter', -apple-system, sans-serif;
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    html {
      background-color: var(--bg-color);
      min-height: 100%;
    }

    body {
      background-color: var(--bg-color);
      background-image: radial-gradient(circle at 50% 0%, #16161a 0%, #080808 75%);
      background-attachment: fixed;
      color: var(--text-main);
      font-family: var(--font-body);
      line-height: 1.6;
      letter-spacing: 0.03em;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; transition: all 0.25s ease; }
    .container { max-width: 860px; margin: 0 auto; padding: 0 24px; }
    
    /* Header */
    header { padding: 50px 0 30px; text-align: center; }
    .logo-container { display: inline-block; margin-bottom: 24px; }
    .site-logo {
      max-width: 220px;
      width: 100%;
      height: auto;
      display: block;
      margin: 0 auto;
      filter: contrast(180%) brightness(130%);
      mix-blend-mode: screen;
    }
    .logo-text {
      font-family: var(--font-heading);
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #fff;
    }

    /* Navigation */
    nav ul { list-style: none; display: flex; justify-content: center; gap: 36px; flex-wrap: wrap; }
    nav a {
      font-family: var(--font-heading);
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.2em;
      position: relative;
      padding: 6px 0;
    }
    nav a::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; width: 0; height: 2px;
      background-color: var(--accent-color);
      transition: width 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    nav a:hover, nav a.active { color: #fff; }
    nav a:hover::after, nav a.active::after { width: 100%; }
    
    /* Section */
    section { padding: 30px 0 80px; }
    .section-title {
      font-family: var(--font-heading);
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-bottom: 35px;
      display: flex;
      align-items: center;
      gap: 12px;
      color: #fff;
    }
    .section-title::before {
      content: '';
      width: 3px;
      height: 18px;
      background-color: var(--accent-color);
    }
    
    .disco-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 24px;
    }
    .disco-item {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 4px;
      padding: 20px;
      text-align: center;
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 15px 35px rgba(0,0,0,0.3);
    }
    .disco-item:hover {
      border-color: var(--card-border-hover);
      transform: translateY(-5px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }
    .disco-img-wrapper {
      width: 100%;
      aspect-ratio: 1 / 1;
      background-color: #121212;
      margin-bottom: 16px;
      border: 1px solid var(--card-border);
      border-radius: 2px;
      overflow: hidden;
    }
    .disco-img-wrapper img { width: 100%; height: 100%; object-fit: cover; }
    .disco-item h3 { font-size: 1rem; font-weight: 700; margin-bottom: 4px; color: #fff; }
    .disco-item .year { font-size: 0.75rem; color: var(--accent-color); font-family: var(--font-heading); font-weight: 700; }
    
    /* Footer */
    footer {
      padding: 50px 0;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      border-top: 1px solid var(--card-border);
      margin-top: 40px;
    }
    
    @media (max-width: 768px) {
      .site-logo { max-width: 180px; }
      nav ul { gap: 18px; }
      .disco-grid { grid-template-columns: repeat(2, 1fr); gap: 16px; }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="logo-container">
        <a href="index.html">
          <img src="images/logo.png" alt="Leecher" class="site-logo" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
          <span class="logo-text" style="display: none;">LEECHER</span>
        </a>
      </div>
      <nav>
        <ul>
          <li><a href="index.html">HOME</a></li>
          <li><a href="discography.html" class="active">DISCOGRAPHY</a></li>
          <li><a href="media.html">MEDIA</a></li>
          <li><a href="contact.html">CONTACT</a></li>
        </ul>
      </nav>
    </header>

    <section>
      <h2 class="section-title">DISCOGRAPHY</h2>
      
      <div class="disco-grid">
        <div class="disco-item">
          <div class="disco-img-wrapper">
            <!-- <img src="aton.jpg" alt="A.T.O.N."> -->
          </div>
          <h3>A.T.O.N.</h3>
          <p class="year">2025</p>
        </div>
      </div>
    </section>

    <footer>
      <p>&copy; Leecher. All Rights Reserved.</p>
    </footer>
  </div>

</body>
</html>
