<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DISCOGRAPHY | Leecher</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #080808;
      --card-bg: rgba(18, 18, 18, 0.7);
      --text-color: #f0f0f0;
      --text-muted: #888888;
      --accent-color: #ffffff;
      --border-color: rgba(255, 255, 255, 0.08);
      --border-hover: rgba(255, 255, 255, 0.25);
      --font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: var(--font-family);
      line-height: 1.8;
      letter-spacing: 0.08em;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
    .container { max-width: 960px; margin: 0 auto; padding: 0 24px; }
    
    /* Header Navigation */
    header { padding: 45px 0 25px; text-align: center; }
    .site-logo {
      max-width: 240px;
      width: 100%;
      height: auto;
      display: block;
      margin: 0 auto 20px;
      filter: contrast(180%) brightness(130%);
      mix-blend-mode: screen;
      transition: transform 0.4s ease, filter 0.4s ease;
    }
    .site-logo:hover {
      transform: scale(1.02);
      filter: contrast(200%) brightness(150%);
    }

    nav ul { list-style: none; display: flex; justify-content: center; gap: 36px; }
    nav a {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.18em;
      position: relative;
      padding-bottom: 4px;
    }
    nav a::after {
      content: '';
      position: absolute;
      bottom: 0; left: 50%;
      width: 0; height: 1px;
      background: var(--accent-color);
      transition: all 0.3s ease;
      transform: translateX(-50%);
    }
    nav a:hover, nav a.active { color: var(--accent-color); }
    nav a:hover::after, nav a.active::after { width: 100%; }
    
    /* Main Content */
    section { padding: 50px 0 100px; }
    .section-title {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-bottom: 40px;
      display: flex;
      align-items: center;
      gap: 15px;
    }
    .section-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, var(--border-hover), transparent);
    }
    
    /* Discography Grid */
    .disco-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 30px;
    }
    .disco-item {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 20px;
      text-align: center;
      transition: all 0.3s ease;
    }
    .disco-item:hover {
      border-color: var(--border-hover);
      transform: translateY(-4px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .disco-img-wrapper {
      width: 100%;
      aspect-ratio: 1 / 1;
      background-color: #121212;
      margin-bottom: 16px;
      border-radius: 4px;
      border: 1px solid var(--border-color);
      overflow: hidden;
    }
    .disco-img-wrapper img { width: 100%; height: 100%; object-fit: cover; }
    .disco-item h3 { font-size: 1.05rem; font-weight: 600; margin-bottom: 4px; color: #fff; }
    .disco-item .year { font-size: 0.85rem; color: var(--text-muted); font-weight: 300; }
    
    footer { padding: 50px 0; text-align: center; color: var(--text-muted); font-size: 0.75rem; letter-spacing: 0.1em; border-top: 1px solid var(--border-color); }
    
    @media (max-width: 768px) {
      .site-logo { max-width: 180px; }
      nav ul { gap: 18px; }
      .disco-grid { grid-template-columns: repeat(2, 1fr); gap: 16px; }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>
        <a href="index.html">
          <img src="leecher-logo.png" alt="Leecher" class="site-logo">
        </a>
      </h1>
      <nav>
        <ul>
          <li><a href="index.html">HOME</a></li>
          <li><a href="discography.html" class="active">DISCOGRAPHY</a></li>
          <li><a href="media.html">MEDIA</a></li>
          <li><a href="contact.html">CONTACT</a></li>
        </ul>
      </nav>
    </header>

    <section>
      <h2 class="section-title">DISCOGRAPHY</h2>
      
      <div class="disco-grid">
        <div class="disco-item">
          <div class="disco-img-wrapper">
            <!-- ジャケット画像を用意したら <img src="aton.jpg" alt="A.T.O.N."> に差し替え -->
          </div>
          <h3>A.T.O.N.</h3>
          <p class="year">2025</p>
        </div>
      </div>
    </section>

    <footer>
      <p>&copy; Leecher. All Rights Reserved.</p>
    </footer>
  </div>

</body>
</html>
