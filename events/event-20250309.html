<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mysteries of Modular | Leecher</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #080808;
      --card-bg: rgba(18, 18, 18, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-border-hover: rgba(255, 255, 255, 0.25);
      --text-main: #f0f0f0;
      --text-muted: #888888;
      --accent-color: #e53935;
      --font-heading: 'Syne', sans-serif;
      --font-body: 'Inter', -apple-system, sans-serif;
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    html {
      background-color: var(--bg-color);
      min-height: 100%;
    }

    body {
      background-color: var(--bg-color);
      background-image: radial-gradient(circle at 50% 0%, #16161a 0%, #080808 75%);
      background-attachment: fixed;
      color: var(--text-main);
      font-family: var(--font-body);
      line-height: 1.6;
      letter-spacing: 0.03em;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; transition: all 0.25s ease; }
    .container { max-width: 860px; margin: 0 auto; padding: 0 24px; }
    
    /* Header */
    header { padding: 50px 0 30px; text-align: center; }
    .logo-container { display: inline-block; margin-bottom: 24px; }
    .site-logo {
      max-width: 220px;
      width: 100%;
      height: auto;
      display: block;
      margin: 0 auto;
      filter: contrast(180%) brightness(130%);
      mix-blend-mode: screen;
    }
    .logo-text {
      font-family: var(--font-heading);
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #fff;
    }

    /* Navigation */
    nav ul { list-style: none; display: flex; justify-content: center; gap: 36px; flex-wrap: wrap; }
    nav a {
      font-family: var(--font-heading);
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.2em;
      position: relative;
      padding: 6px 0;
    }
    nav a::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; width: 0; height: 2px;
      background-color: var(--accent-color);
      transition: width 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    nav a:hover, nav a.active { color: #fff; }
    nav a:hover::after, nav a.active::after { width: 100%; }
    
    /* Section */
    section { padding: 30px 0 80px; }

    /* Event Detail Specifics */
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-heading);
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 0.15em;
      margin-bottom: 28px;
    }
    .back-link:hover {
      color: #fff;
    }

    .event-detail-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 4px;
      overflow: hidden;
      box-shadow: 0 15px 35px rgba(0,0,0,0.3);
    }

    .event-flyer-large {
      width: 100%;
      max-height: 580px;
      background-color: #111;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    .event-flyer-large img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      max-height: 580px;
    }

    .event-detail-body {
      padding: 36px;
    }

    .event-date-tag {
      font-size: 0.8rem;
      color: var(--accent-color);
      font-family: var(--font-heading);
      font-weight: 700;
      letter-spacing: 0.15em;
      margin-bottom: 8px;
    }

    .event-main-title {
      font-size: 1.6rem;
      font-weight: 700;
      color: #fff;
      line-height: 1.3;
      margin-bottom: 28px;
      letter-spacing: 0.02em;
    }

    .event-info-list {
      display: grid;
      grid-template-columns: 100px 1fr;
      gap: 16px 20px;
      font-size: 0.9rem;
      border-top: 1px solid var(--card-border);
      padding-top: 24px;
    }

    .info-label {
      color: var(--text-muted);
      font-family: var(--font-heading);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    .info-value {
      color: var(--text-main);
    }

    /* Footer */
    footer {
      padding: 50px 0;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      border-top: 1px solid var(--card-border);
      margin-top: 40px;
    }
    
    @media (max-width: 768px) {
      .site-logo { max-width: 180px; }
      nav ul { gap: 18px; }
      .event-detail-body { padding: 24px; }
      .event-main-title { font-size: 1.3rem; }
      .event-info-list { grid-template-columns: 1fr; gap: 4px; }
      .info-label { margin-top: 12px; }
      .info-label:first-child { margin-top: 0; }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="logo-container">
        <a href="../index.html">
          <img src="../images/logo.png" alt="Leecher" class="site-logo" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
          <span class="logo-text" style="display: none;">LEECHER</span>
        </a>
      </div>
      <nav>
        <ul>
          <li><a href="../index.html" class="active">HOME</a></li>
          <li><a href="../discography.html">DISCOGRAPHY</a></li>
          <li><a href="../media.html">MEDIA</a></li>
          <li><a href="../contact.html">CONTACT</a></li>
        </ul>
      </nav>
    </header>

    <section>
      <a href="../index.html" class="back-link">&larr; BACK TO SCHEDULE</a>

      <article class="event-detail-card">
        <div class="event-flyer-large">
          <img src="../images/79619f7758eb92bfc4f9f5c033528df6_6f5a755907a81845d358c846412988a0.jpg" alt="Mysteries of Modular" onerror="this.src='https://via.placeholder.com/800x800/111/fff?text=FLYER+IMAGE'">
        </div>

        <div class="event-detail-body">
          <div class="event-date-tag">2025.03.09 SUN</div>
          <h1 class="event-main-title">Mysteries of Modular</h1>

          <div class="event-info-list">
            <span class="info-label">DATE</span>
            <span class="info-value">2025年3月9日 (日)</span>

            <span class="info-label">TIME</span>
            <span class="info-value">OPEN 16:30 / START 17:00</span>

            <span class="info-label">VENUE</span>
            <span class="info-value">落合 Soup</span>

            <span class="info-label">TICKET</span>
            <span class="info-value">&yen;2,000</span>

            <span class="info-label">ACTS</span>
            <span class="info-value">
              Leecher<br>
              ...and more
            </span>
          </div>
        </div>
      </article>
    </section>

    <footer>
      <p>&copy; Leecher. All Rights Reserved.</p>
    </footer>
  </div>

</body>
</html>
