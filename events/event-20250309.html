<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2025/3/9 Mysteries of Modular | Leecher</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #030303;
      --card-bg: #0c0c0c;
      --text-color: #ededed;
      --text-muted: #737373;
      --accent-color: #ffffff;
      --highlight-color: #e53935;
      --border-color: #1f1f1f;
      --font-heading: 'Syne', sans-serif;
      --font-body: 'Inter', -apple-system, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: var(--font-body);
      line-height: 1.6;
      letter-spacing: 0.04em;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; transition: all 0.25s ease; }
    .container { max-width: 900px; margin: 0 auto; padding: 0 24px; }
    
    /* Header */
    header { padding: 60px 0 35px; text-align: center; }
    .logo-container { display: inline-block; margin-bottom: 25px; }
    .site-logo {
      max-width: 240px;
      width: 100%;
      height: auto;
      display: block;
      margin: 0 auto;
      filter: contrast(180%) brightness(130%);
      mix-blend-mode: screen;
    }
    .logo-text {
      font-family: var(--font-heading);
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #fff;
    }

    /* Navigation */
    nav ul { list-style: none; display: flex; justify-content: center; gap: 32px; flex-wrap: wrap; }
    nav a {
      font-family: var(--font-heading);
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.2em;
      position: relative;
      padding: 4px 0;
    }
    nav a::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; width: 0; height: 1px;
      background-color: var(--highlight-color);
      transition: width 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    nav a:hover, nav a.active { color: var(--accent-color); }
    nav a:hover::after, nav a.active::after { width: 100%; }
    
    /* Article Detail Section */
    article.event-detail {
      padding: 40px 0 90px;
    }

    /* Main Detail Content */
    .detail-body { width: 100%; }
    .detail-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 25px;
      line-height: 1.3;
    }

    /* イベント情報枠 */
    .event-info-box {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 24px;
      margin-bottom: 30px;
      font-size: 0.85rem;
    }
    .info-row {
      display: flex;
      margin-bottom: 12px;
      word-break: break-all;
    }
    .info-row:last-child {
      margin-bottom: 0;
    }
    .info-label {
      width: 90px;
      flex-shrink: 0;
      color: var(--text-muted);
      font-family: var(--font-heading);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.1em;
    }
    .info-value {
      color: #ededed;
    }

    /* 出演者リスト */
    .act-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 12px;
    }
    .act-tags span::after {
      content: ' /';
      color: var(--text-muted);
      margin-left: 12px;
    }
    .act-tags span:last-child::after {
      content: '';
    }

    .detail-flyer {
      width: 100%;
      max-width: 650px;
      border: 1px solid var(--border-color);
      display: block;
      margin-top: 20px;
    }

    .back-link {
      display: inline-block;
      margin-top: 35px;
      font-family: var(--font-heading);
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 0.1em;
    }
    .back-link:hover { color: #fff; }

    /* Footer */
    footer { padding: 45px 0; text-align: center; color: var(--text-muted); font-size: 0.7rem; letter-spacing: 0.15em; border-top: 1px solid var(--border-color); }
    
    @media (max-width: 768px) {
      nav ul { gap: 16px; }
      .info-row { flex-direction: column; gap: 2px; margin-bottom: 14px; }
      .event-info-box { padding: 18px; }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="logo-container">
        <a href="../index.html">
          <img src="../images/logo.png" alt="Leecher" class="site-logo" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
          <span class="logo-text" style="display: none;">LEECHER</span>
        </a>
      </div>
      <nav>
        <ul>
          <li><a href="../index.html" class="active">HOME</a></li>
          <li><a href="../discography.html">DISCOGRAPHY</a></li>
          <li><a href="../media.html">MEDIA</a></li>
          <li><a href="../contact.html">CONTACT</a></li>
        </ul>
      </nav>
    </header>

    <article class="event-detail">
      <div class="detail-body">
        <h1 class="detail-title">Mysteries of Modular</h1>
        
        <div class="event-info-box">
          <div class="info-row">
            <span class="info-label">DATE</span>
            <span class="info-value">2025/3/9 (Sun)</span>
          </div>
          <div class="info-row">
            <span class="info-label">VENUE</span>
            <span class="info-value">高円寺 Oriental Force</span>
          </div>
          <div class="info-row">
            <span class="info-label">TIME</span>
            <span class="info-value">OPEN 18:00 / START 18:30</span>
          </div>
          <div class="info-row">
            <span class="info-label">PRICE</span>
            <span class="info-value">&yen;1,500 (+1 Drink)</span>
          </div>
          <div class="info-row" style="margin-top: 6px;">
            <span class="info-label">ACTS</span>
            <div class="info-value act-tags">
              <span>HERNIA</span>
              <span>Kenichi Takagi</span>
              <span>Leecher</span>
              <span>DNS</span>
              <span>MizutaMa</span>
              <span>Dave Skipper</span>
            </div>
          </div>
        </div>

        <img src="../images/79619f7758eb92bfc4f9f5c033528df6_6f5a755907a81845d358c846412988a0.jpg" alt="Mysteries of Modular Flyer" class="detail-flyer" onerror="this.src='https://via.placeholder.com/700x700/111/fff?text=FLYER+IMAGE'">

        <div>
          <a href="../index.html" class="back-link">&larr; BACK TO LIST</a>
        </div>
      </div>
    </article>

    <footer>
      <p>&copy; Leecher. All Rights Reserved.</p>
    </footer>
  </div>

</body>
</html>
