<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CONTACT | Leecher</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #030303;
      --card-bg: #0c0c0c;
      --text-color: #ededed;
      --text-muted: #737373;
      --accent-color: #ffffff;
      --highlight-color: #e53935;
      --border-color: #1f1f1f;
      --border-hover: #404040;
      --font-heading: 'Syne', sans-serif;
      --font-body: 'Inter', -apple-system, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: var(--font-body);
      line-height: 1.7;
      letter-spacing: 0.06em;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; transition: all 0.25s ease; }
    .container { max-width: 900px; margin: 0 auto; padding: 0 24px; }
    
    header { padding: 60px 0 35px; text-align: center; }
    .logo-container { display: inline-block; margin-bottom: 25px; }
    .site-logo {
      max-width: 240px;
      width: 100%;
      height: auto;
      display: block;
      margin: 0 auto;
      filter: contrast(180%) brightness(130%);
      mix-blend-mode: screen;
    }
    .logo-text {
      font-family: var(--font-heading);
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #fff;
    }

    nav ul { list-style: none; display: flex; justify-content: center; gap: 32px; }
    nav a {
      font-family: var(--font-heading);
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.2em;
      position: relative;
      padding: 4px 0;
    }
    nav a::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; width: 0; height: 1px;
      background-color: var(--highlight-color);
      transition: width 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    nav a:hover, nav a.active { color: var(--accent-color); }
    nav a:hover::after, nav a.active::after { width: 100%; }
    
    section { padding: 40px 0 90px; text-align: center; }
    .section-title {
      font-family: var(--font-heading);
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      margin-bottom: 35px;
      display: inline-flex;
      align-items: center;
      gap: 15px;
    }
    .section-title::before {
      content: '';
      width: 4px;
      height: 16px;
      background-color: var(--highlight-color);
    }
    
    .contact-box {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 2px;
      padding: 45px 20px;
      max-width: 540px;
      margin: 20px auto 0;
    }
    .contact-box p { font-size: 1.05rem; margin-bottom: 15px; }
    .email-link {
      color: #fff;
      border-bottom: 1px solid var(--text-muted);
      padding-bottom: 2px;
    }
    .email-link:hover { border-bottom-color: var(--highlight-color); }
    .note { color: var(--text-muted); font-size: 0.85rem; letter-spacing: 0.1em; }
    
    footer { padding: 45px 0; text-align: center; color: var(--text-muted); font-size: 0.7rem; letter-spacing: 0.15em; border-top: 1px solid var(--border-color); }
    
    @media (max-width: 768px) {
      .site-logo { max-width: 180px; }
      nav ul { gap: 16px; }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="logo-container">
        <a href="index.html">
          <img src="images/logo.png" alt="Leecher" class="site-logo" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
          <span class="logo-text" style="display: none;">LEECHER</span>
        </a>
      </div>
      <nav>
        <ul>
          <li><a href="index.html">HOME</a></li>
          <li><a href="discography.html">DISCOGRAPHY</a></li>
          <li><a href="media.html">MEDIA</a></li>
          <li><a href="contact.html" class="active">CONTACT</a></li>
        </ul>
      </nav>
    </header>

    <section>
      <h2 class="section-title">CONTACT</h2>
      <div class="contact-box">
        <p>Contact : <a href="mailto:Leecher4410@gmail.com" class="email-link">Leecher4410@gmail.com</a></p>
        <p class="note">A.T.O.N.</p>
      </div>
    </section>

    <footer>
      <p>&copy; Leecher. All Rights Reserved.</p>
    </footer>
  </div>

</body>
</html>
