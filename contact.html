<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CONTACT | Leecher</title>
  <link rel="icon" href="images/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #080808;
      --card-bg: rgba(18, 18, 18, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-border-hover: rgba(255, 255, 255, 0.2);
      --text-main: #f0f0f0;
      --text-muted: #888888;
      --accent-color: #e53935;
      --font-heading: 'Syne', sans-serif;
      --font-body: 'Inter', -apple-system, sans-serif;
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    html {
      background-color: var(--bg-color);
      min-height: 100%;
    }

    body {
      background-color: var(--bg-color);
      background-image: radial-gradient(circle at 50% 0%, #16161a 0%, #080808 75%);
      background-attachment: fixed;
      color: var(--text-main);
      font-family: var(--font-body);
      line-height: 1.6;
      letter-spacing: 0.03em;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; transition: all 0.25s ease; }
    .container { max-width: 860px; margin: 0 auto; padding: 0 24px; }
    
    /* Header */
    header { padding: 50px 0 30px; text-align: center; }
    .logo-container { display: inline-block; margin-bottom: 24px; }
    .site-logo {
      max-width: 220px;
      width: 100%;
      height: auto;
      display: block;
      margin: 0 auto;
      filter: contrast(180%) brightness(130%);
      mix-blend-mode: screen;
    }
    .logo-text {
      font-family: var(--font-heading);
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #fff;
    }

    /* Navigation */
    nav ul { list-style: none; display: flex; justify-content: center; gap: 36px; flex-wrap: wrap; }
    nav a {
      font-family: var(--font-heading);
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.2em;
      position: relative;
      padding: 6px 0;
    }
    nav a::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; width: 0; height: 2px;
      background-color: var(--accent-color);
      transition: width 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    nav a:hover, nav a.active { color: #fff; }
    nav a:hover::after, nav a.active::after { width: 100%; }
    
    /* Section */
    section { padding: 30px 0 80px; }

    .section-title {
      font-family: var(--font-heading);
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-bottom: 35px;
      display: flex;
      align-items: center;
      gap: 12px;
      color: #fff;
    }
    .section-title::before {
      content: '';
      width: 3px;
      height: 18px;
      background-color: var(--accent-color);
    }
    
    .contact-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-left: 3px solid var(--accent-color);
      border-radius: 4px;
      padding: 28px 32px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.3);
    }

    .contact-grid {
      display: grid;
      grid-template-columns: 120px 1fr;
      gap: 18px 20px;
      align-items: center;
      font-size: 0.9rem;
    }

    .contact-label {
      color: var(--text-muted);
      font-family: var(--font-heading);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    .contact-value a {
      color: var(--text-main);
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
      padding-bottom: 2px;
      word-break: break-all;
      transition: all 0.2s ease;
    }
    .contact-value a:hover {
      color: #fff;
      border-bottom-color: var(--accent-color);
    }
    
    /* Footer */
    footer {
      padding: 50px 0;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      border-top: 1px solid var(--card-border);
      margin-top: 40px;
    }
    
    @media (max-width: 768px) {
      .site-logo { 
        max-width: 180px; 
        mix-blend-mode: normal; 
        filter: none; 
      }
      nav ul { gap: 18px; }
      .contact-card { padding: 20px; }
      .contact-grid { grid-template-columns: 1fr; gap: 4px; }
      .contact-label { margin-top: 14px; }
      .contact-label:first-child { margin-top: 0; }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="logo-container">
        <a href="index.html">
          <img src="images/logo.png" alt="Leecher" class="site-logo" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
          <span class="logo-text" style="display: none;">LEECHER</span>
        </a>
      </div>
      <nav>
        <ul>
          <li><a href="index.html">HOME</a></li>
          <li><a href="discography.html">DISCOGRAPHY</a></li>
          <li><a href="media.html">MEDIA</a></li>
          <li><a href="contact.html" class="active">CONTACT</a></li>
        </ul>
      </nav>
    </header>

    <section>
      <h2 class="section-title">CONTACT</h2>
      
      <div class="contact-card">
        <div class="contact-grid">
          <span class="contact-label">EMAIL</span>
          <span class="contact-value"><a href="mailto:Leecher4410@gmail.com">Leecher4410@gmail.com</a></span>

          <span class="contact-label">DISCOGS</span>
          <span class="contact-value"><a href="https://www.discogs.com/ja/artist/5840711-Leecher-3" target="_blank" rel="noopener">https://www.discogs.com/ja/artist/5840711-Leecher-3</a></span>

          <span class="contact-label">X (TWITTER)</span>
          <span class="contact-value"><a href="https://x.com/Leecher_" target="_blank" rel="noopener">@Leecher_</a></span>
        </div>
      </div>
    </section>

    <footer>
      <p>&copy; Leecher. All Rights Reserved.</p>
    </footer>
  </div>

</body>
</html>
