<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leecher | Official</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #030303;
      --card-bg: #0c0c0c;
      --text-color: #ededed;
      --text-muted: #737373;
      --accent-color: #ffffff;
      --highlight-color: #e53935;
      --border-color: #1f1f1f;
      --border-hover: #404040;
      --font-heading: 'Syne', sans-serif;
      --font-body: 'Inter', -apple-system, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: var(--font-body);
      line-height: 1.7;
      letter-spacing: 0.06em;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; transition: all 0.25s ease; }
    .container { max-width: 900px; margin: 0 auto; padding: 0 24px; }
    
    /* Header */
    header { padding: 60px 0 35px; text-align: center; }
    .logo-container { display: inline-block; margin-bottom: 25px; }
    .site-logo {
      max-width: 240px;
      width: 100%;
      height: auto;
      display: block;
      margin: 0 auto;
      filter: contrast(180%) brightness(130%);
      mix-blend-mode: screen;
    }
    .logo-text {
      font-family: var(--font-heading);
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #fff;
    }

    /* Navigation */
    nav ul { list-style: none; display: flex; justify-content: center; gap: 32px; flex-wrap: wrap; }
    nav a {
      font-family: var(--font-heading);
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.2em;
      position: relative;
      padding: 4px 0;
    }
    nav a::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; width: 0; height: 1px;
      background-color: var(--highlight-color);
      transition: width 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    nav a:hover, nav a.active { color: var(--accent-color); }
    nav a:hover::after, nav a.active::after { width: 100%; }
    
    /* Section & Grid Layout */
    section { padding: 40px 0 90px; }
    
    /* Section Title Styles (discography.htmlと同スタイルに統一) */
    .section-title {
      font-family: var(--font-heading);
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      margin-bottom: 35px;
      display: flex;
      align-items: center;
      gap: 15px;
      color: #fff;
    }
    .section-title::before {
      content: '';
      width: 4px;
      height: 16px;
      background-color: var(--highlight-color);
    }

    .event-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 32px;
    }

    .event-card {
      display: block;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 2px;
      overflow: hidden;
      transition: all 0.3s ease;
    }
    .event-card:hover {
      border-color: var(--border-hover);
      transform: translateY(-4px);
    }

    .flyer-image-wrapper {
      width: 100%;
      aspect-ratio: 1 / 1;
      background-color: #111;
      overflow: hidden;
      border-bottom: 1px solid var(--border-color);
      position: relative;
    }
    .flyer-image-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease, filter 0.4s ease;
      filter: brightness(0.9);
    }
    .event-card:hover .flyer-image-wrapper img {
      transform: scale(1.03);
      filter: brightness(1);
    }

    .event-content { padding: 20px; }
    .post-date {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-family: var(--font-heading);
      margin-bottom: 8px;
    }
    .event-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: #fff;
      line-height: 1.4;
      letter-spacing: 0.02em;
    }

    /* Footer */
    footer { padding: 45px 0; text-align: center; color: var(--text-muted); font-size: 0.7rem; letter-spacing: 0.15em; border-top: 1px solid var(--border-color); }
    
    @media (max-width: 768px) {
      .site-logo { max-width: 180px; }
      .event-grid { grid-template-columns: 1fr; gap: 24px; }
      nav ul { gap: 16px; }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="logo-container">
        <a href="index.html">
          <img src="images/logo.png" alt="Leecher" class="site-logo" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
          <span class="logo-text" style="display: none;">LEECHER</span>
        </a>
      </div>
      <nav>
        <ul>
          <li><a href="index.html" class="active">HOME</a></li>
          <li><a href="discography.html">DISCOGRAPHY</a></li>
          <li><a href="media.html">MEDIA</a></li>
          <li><a href="contact.html">CONTACT</a></li>
        </ul>
      </nav>
    </header>

    <section>
      <h2 class="section-title">LIVE SCHEDULE</h2>

      <div class="event-grid">
        
        <!-- EVENT 1 -->
        <a href="events/event-20250309.html" class="event-card">
          <div class="flyer-image-wrapper">
            <img src="images/79619f7758eb92bfc4f9f5c033528df6_6f5a755907a81845d358c846412988a0.jpg" alt="2025/3/9 Mysteries of Modular" onerror="this.src='https://via.placeholder.com/600x600/111/fff?text=FLYER+IMAGE'">
          </div>
          <div class="event-content">
            <div class="post-date">2025.03.05</div>
            <h2 class="event-title">2025/3/9 Mysteries of Modular</h2>
          </div>
        </a>

        <!-- EVENT 2 -->
        <a href="events/event-20241012.html" class="event-card">
          <div class="flyer-image-wrapper">
            <img src="images/flyer-20241012.jpg" alt="2024/10/12 Heavier than jupiter" onerror="this.src='https://via.placeholder.com/600x600/111/fff?text=FLYER+IMAGE'">
          </div>
          <div class="event-content">
            <div class="post-date">2024.10.11</div>
            <h2 class="event-title">2024/10/12 Heavier than jupiter: manifest mini-fest</h2>
          </div>
        </a>

      </div>
    </section>

    <footer>
      <p>&copy; Leecher. All Rights Reserved.</p>
    </footer>
  </div>

</body>
</html>
